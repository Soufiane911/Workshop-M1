<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel-X · Supervision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-title">
      <strong>Sentinel-X</strong>
      <span>Supervision du poste</span>
    </div>
    <!-- Navigation : une page par onglet, routage par #/… -->
    <nav class="tabs" aria-label="Pages">
      <a href="#/" data-route="">Vue d'ensemble</a>
      <a href="#/capteurs" data-route="capteurs">Capteurs</a>
      <a href="#/camera" data-route="camera">Caméra</a>
      <a href="#/alarmes" data-route="alarmes">Alarmes</a>
      <a href="#/systeme" data-route="systeme">Système</a>
    </nav>
    <div class="bar-meta">
      <span id="device-id">sentinel-01</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <!-- Bandeau d'état permanent : la couleur n'apparaît que si quelque chose est anormal -->
  <section class="strip" aria-label="État du système">
    <div class="cell" id="cell-device">
      <span class="cell-k">Liaison boîtier</span>
      <span class="cell-v" id="device-label">—</span>
    </div>
    <div class="cell" id="cell-ws">
      <span class="cell-k">Flux temps réel</span>
      <span class="cell-v" id="ws-label">connexion…</span>
    </div>
    <div class="cell" id="cell-vision">
      <span class="cell-k">Vision IA</span>
      <span class="cell-v" id="vision-label">arrêtée</span>
    </div>
    <div class="cell" id="cell-last">
      <span class="cell-k">Dernière trame</span>
      <span class="cell-v" id="v-last">—</span>
    </div>
    <div class="cell cell-wide" id="cell-alarm">
      <span class="cell-k">Alarmes non acquittées : <b id="alerts-count">0</b></span>
      <span class="cell-v" id="alarm-banner">Aucune alarme active</span>
    </div>
  </section>

  <main class="page-area">
    <section class="page" id="page-" hidden></section>
    <section class="page" id="page-capteurs" hidden></section>
    <section class="page" id="page-camera" hidden></section>
    <section class="page" id="page-alarmes" hidden></section>
    <section class="page" id="page-systeme" hidden></section>
  </main>

  <dialog id="snap-dialog">
    <img id="snap-img" alt="Capture prise au moment de l'alarme">
    <form method="dialog"><button class="btn">Fermer</button></form>
  </dialog>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/sensors.js"></script>
  <script src="js/pages/camera.js"></script>
  <script src="js/pages/alarms.js"></script>
  <script src="js/pages/system.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
