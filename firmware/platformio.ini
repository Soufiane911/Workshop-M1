; Sentinel-X — firmware de l'ESP8266 (NodeMCU Lolin v3)
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; 160 MHz : divise par deux la durée de la poignée de main TLS
board_build.f_cpu = 160000000L
; Date de compilation : sert d'horloge pour valider le certificat du broker (pas de NTP sur la table)
build_flags = -D BUILD_EPOCH=$UNIX_TIME
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.1
