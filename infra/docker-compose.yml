services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mosquitto
    restart: unless-stopped
    ports:
      # MQTTS uniquement (aucun port en clair) : PC serveur + WiFi de table (le boîtier ESP8266)
      - "127.0.0.1:8883:8883"
      - "10.42.0.1:8883:8883"
    volumes:
      # Certificats + passwd : générés par security/init-mqtt.sh
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans infra/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Pas de port exposé : la base n'est joignable que par l'API

  api:
    build: ../backend
    container_name: sentinel-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_USERNAME: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?lancer security/init-mqtt.sh}
      MQTT_CA_CERT: /certs/ca.crt
      DASHBOARD_DIR: /app/dashboard
      SNAPSHOT_DIR: /data/snapshots
    ports:
      - "127.0.0.1:8000:8000"
      # Dashboard pour l'équipe connectée au WiFi de table (sans authentification pour l'instant)
      - "10.42.0.1:8000:8000"
    volumes:
      - ../dashboard:/app/dashboard:ro
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
      - api-snapshots:/data/snapshots

  anomalies:
    build:
      context: ..
      dockerfile: ia/anomalies/Dockerfile
    container_name: sentinel-anomalies
    restart: unless-stopped
    depends_on:
      - mosquitto
      - api
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_USERNAME: ia
      MQTT_PASSWORD: ${MQTT_IA_PASSWORD:?lancer security/init-mqtt.sh}
      MQTT_CA_CERT: /certs/ca.crt
      API_URL: http://api:8000/api/v1
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
    # Aucun port exposé : le service ne fait que lire MQTT et écrire dans l'API

volumes:
  mosquitto-data:
  mosquitto-log:
  db-data:
  api-snapshots:
