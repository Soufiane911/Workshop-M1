# Sentinel-X — broker MQTT durci
# Un seul point d'entrée : MQTTS (TLS 1.2+), comptes obligatoires, droits par topic.
# Certificats et passwd générés par security/init-mqtt.sh (non commités).

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Pas de certificat client exigé : l'authentification se fait par compte + mot de passe dans le tunnel TLS
require_certificate false

# Anti-DoS (pentest) : messages du boîtier < 512 octets, une poignée de clients légitimes
max_connections 32
max_packet_size 8192
max_inflight_messages 20
max_queued_messages 200
allow_zero_length_clientid false

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
# notice : connexions et refus d'authentification (preuves pour le rapport d'audit)
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
