# Sentinel-X — broker MQTT durci
# Un seul point d'entrée : MQTTS (TLS 1.2+), comptes obligatoires, droits par topic.
# Certificats et passwd générés par security/init-mqtt.sh (non commités).

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# TLS 1.2 : uniquement échange ECDHE (confidentialité persistante) + chiffrement authentifié (GCM/ChaCha20).
# Pas de CBC, RSA, SHA-1 ni suites faibles. La clé du broker est ECDSA (P-256), d'où ECDHE-ECDSA.
# L'ESP8266 (BearSSL) négocie ECDHE-ECDSA-AES256-GCM-SHA384. TLS 1.3 garde ses suites par défaut (toutes AEAD).
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305
# Pas de certificat client exigé : l'authentification se fait par compte + mot de passe dans le tunnel TLS
require_certificate false

# Anti-DoS (pentest) : messages du boîtier < 512 octets, une poignée de clients légitimes
max_connections 32
max_packet_size 8192
max_inflight_messages 20
max_queued_messages 200
allow_zero_length_clientid false

persistence true
persistence_location /mosquitto/data/

# Logs sur stdout uniquement : Docker les fait tourner (infra/docker-compose.yml, logging)
# au lieu d'un fichier qui grossit sans limite. Lecture : docker logs sentinel-mosquitto
log_dest stdout
# notice : connexions et refus d'authentification (preuves pour le rapport d'audit)
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
